services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: tms_local_only
      POSTGRES_DB: richie_tms
    # Host port is overridable (DB_PORT) so a second compose project —
    # e.g. the Phase 7 smoke stack — can run its own database while
    # this one is up; containers always reach Postgres on 5432 via the
    # compose network. Default unchanged for every existing workflow.
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms -d richie_tms"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:

  # D-092/7A: production app (build first: `podman compose build app`).
  # The verify-phase*.sh scripts only ever start `db`, so this service
  # never interferes with the disposable test databases. AUTH_SECRET
  # must be supplied (compose .env or shell) — there is no default.
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tms:tms_local_only@db:5432/richie_tms
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set (at least 32 characters)}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
