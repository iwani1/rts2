name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tms
          POSTGRES_PASSWORD: tms_local_only
          POSTGRES_DB: richie_tms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tms -d richie_tms_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://tms:tms_local_only@localhost:5432/richie_tms_test?schema=public
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-secret-that-is-long-enough-for-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
